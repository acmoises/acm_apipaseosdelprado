; ==============================================================================
; Configuración de Seguridad y Hardening de PHP (Laravel API)
; Mitigación en Profundidad contra PHP2Shell (CVE-2026-109618, CVE-2026-109619)
; ==============================================================================

; 1. Mitigación directa de vulnerabilidad de ejecución remota (UAF)
; session.upload_progress está habilitado por defecto en PHP y es el vector
; primordial de explotación de CVE-2026-109619 en workers persistentes.
session.upload_progress.enabled = Off

; 2. Ocultar información y huella digital del servidor (Evita fingerprinting)
expose_php = Off

; 3. Supresión de errores en respuestas públicas (Previene fuga de rutas y memoria)
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; 4. Gestión de memoria y prevención de DoS / OOM Aborts (CVE-2026-109618)
memory_limit = 256M
max_execution_time = 60
max_input_time = 60
post_max_size = 64M
upload_max_filesize = 64M

; 5. Endurecimiento de sesiones
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
