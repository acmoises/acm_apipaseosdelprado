; ==============================================================================
; Configuración de Seguridad y Hardening de PHP en Producción (Hostinger / LiteSpeed / PHP-FPM)
; Mitigación en Profundidad contra vulnerabilidades críticas de PHP (CVE-2026-109618, CVE-2026-109619)
; ==============================================================================

session.upload_progress.enabled = Off
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
memory_limit = 256M
post_max_size = 64M
upload_max_filesize = 64M
max_execution_time = 60
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
